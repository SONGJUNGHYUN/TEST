<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>수질조사과 참고자료</title>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 16px 16px 130px;
    background: #f7f8fa;
    color:#111827;
  }

  h1 {
    text-align: center;
    font-size: 24px;
    margin: 10px 0 20px;
    color:#111827;
    white-space: nowrap;
    overflow-x:auto;
  }

  h2 {
    font-size: 18px;
    margin: 0 0 12px;
    border-bottom: 2px solid #333;
    padding-bottom: 6px;
  }

  .section {
    background: white;
    padding: 14px;
    margin-bottom: 16px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .button-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  button {
    font-family: inherit;
    color:#111827;
    -webkit-appearance:none;
    appearance:none;
  }

  .item-btn, .preset-btn, .sample-btn {
    min-height: 58px;
    border: 1px solid #bbb;
    border-radius: 10px;
    background: #f2f2f2;
    cursor: pointer;
    text-align: center;
    padding: 8px;
  }

  .item-name {
    display: block;
    font-weight: bold;
    font-size: 14px;
    line-height: 1.2;
    white-space: nowrap;
    overflow-x:auto;
  }

  .item-name br {
    display: block;
  }

  .item-fee {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    color: #555;
  }

  .selected {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
  }

  .selected .item-fee {
    color: #e0e7ff;
  }

  .partial-selected {
    background: #fef3c7;
    border-color: #f59e0b;
  }

  .empty-cell {
    visibility: hidden;
    min-height: 58px;
  }

  .item-name small,
  .sub {
    font-size: 11px;
    font-weight: normal;
    line-height: 1.2;
  }

  .fee-exempt {
    color: #dc2626;
    font-weight: bold;
  }

  .selected .fee-exempt {
    color: #fecaca;
  }

  .group-header-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    margin: 12px 0 8px;
  }

  .group-header {
    width: 100%;
    padding: 10px 12px;
    border: none;
    border-radius: 8px;
    background: #e5e7eb;
    font-weight: bold;
    font-size: 15px;
    text-align: left;
    cursor: pointer;
  }


  .group-count-selected {
    color: #dc2626;
    font-weight: 800;
  }

  .group-clear-btn {
    min-width: 74px;
    padding: 8px 10px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: #ffffff;
    color: #374151;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }

  .group-clear-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .bottom-result {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: #111827;
    color: white;
    padding: 14px 18px;
    box-shadow: 0 -3px 10px rgba(0,0,0,0.25);
    z-index: 999;
  }

  .bottom-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
    font-size: 14px;
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 22px;
    font-weight: bold;
  }

  #total {
    color: #facc15;
  }

  .bottom-result.detail-open {
    max-height: 70vh;
    overflow-y: auto;
    border-radius: 18px 18px 0 0;
    padding-bottom: 22px;
  }

  .selected-detail {
    display: none;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.22);
  }

  .bottom-result.detail-open .selected-detail {
    display: block;
  }

  .selected-detail-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 8px;
  }

  .selected-detail-list {
    padding: 9px 10px;
    border-radius: 8px;
    background: rgba(255,255,255,0.08);
    font-size: 13px;
    line-height: 1.6;
    word-break: keep-all;
  }

  .selected-detail-item {
    display: inline;
  }

  .selected-detail-empty {
    color: #d1d5db;
    font-size: 13px;
    padding: 8px 0;
  }

  .detail-toggle-btn {
    position: fixed;
    right: 18px;
    bottom: 112px;
    width: 68px;
    height: 68px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.45);
    background: rgba(17,24,39,0.72);
    color: white;
    font-size: 13px;
    font-weight: bold;
    line-height: 1.2;
    z-index: 1001;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .detail-toggle-btn.active {
    background: rgba(250,204,21,0.85);
    color: #111827;
    border-color: rgba(250,204,21,0.95);
  }

  .sample-control {
    display: grid;
    grid-template-columns: 64px 1fr 64px;
    gap: 8px;
    align-items: center;
  }

  .sample-step-btn {
    min-height: 56px;
    border: 1px solid #bbb;
    border-radius: 10px;
    background: #f2f2f2;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
  }

  .sample-number {
    min-height: 56px;
    border: 2px solid #2563eb;
    border-radius: 10px;
    background: white;
    color: #111827;
    font-size: 24px;
    font-weight: bold;
    text-align: center;
  }

  .sample-help {
    margin-top: 8px;
    color: #666;
    font-size: 12px;
    text-align: center;
  }

  @media (max-width: 480px) {
    .button-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    .span-2, .span-3, .span-4 {
      grid-column: span 2;
    }

    .item-name {
      font-size: 12px;
    }

    .item-name small,
    .sub {
      font-size: 10px;
    }
  }

  @media (min-width: 481px) and (max-width: 768px) {
    .button-grid {
      grid-template-columns: repeat(3, 1fr);
    }

    .span-2 { grid-column: span 2; }
    .span-3, .span-4 { grid-column: span 3; }

    .item-name {
      font-size: 13px;
    }
  }

  @media (min-width: 769px) {
    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: span 3; }
    .span-4 { grid-column: span 4; }
  }


  /* ===== App-like minimal UI override ===== */
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }

  body {
    margin: 0;
    padding: 16px 14px 132px;
    background: linear-gradient(180deg, #f3f4f6 0%, #f8fafc 42%, #f7f8fa 100%);
  }

  h1 {
    position: static;
    z-index: auto;
    margin: 4px 0 18px;
    padding: 18px 14px 20px;
    background: rgba(255,255,255,0.86);
    color: #111827;
    border: 1px solid rgba(17, 24, 39, 0.06);
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.07);
    text-align: center;
    font-size: 24px;
    line-height: 1.15;
    letter-spacing: -0.02em;
  }

  .section {
    border: 1px solid rgba(17, 24, 39, 0.06);
    border-radius: 18px;
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.07);
  }

  h2 {
    border-bottom-color: #e5e7eb;
    color: #111827;
  }

  .item-btn,
  .preset-btn,
  .sample-btn,
  .sample-step-btn,
  .group-clear-btn,
  .group-header {
    transition: transform 0.1s ease, box-shadow 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
  }

  .item-btn:active,
  .preset-btn:active,
  .sample-btn:active,
  .sample-step-btn:active,
  .group-clear-btn:active,
  .group-header:active,
  .detail-toggle-btn:active {
    transform: scale(0.97);
  }

  .item-btn,
  .preset-btn,
  .sample-btn {
    background: #ffffff;
    border-color: #d1d5db;
    box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
  }

  .item-btn:hover,
  .preset-btn:hover,
  .sample-btn:hover,
  .group-clear-btn:hover {
    box-shadow: 0 4px 10px rgba(15, 23, 42, 0.08);
  }

  .group-header-row {
    position: sticky;
    top: 0;
    z-index: 700;
    padding: 5px 0;
    margin: 10px 0 8px;
    background: rgba(247, 248, 250, 0.94);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .group-header {
    background: #eef0f3;
    box-shadow: 0 2px 7px rgba(15, 23, 42, 0.05);
  }

  .selected {
    background: #2563eb;
    color: white;

    box-shadow: 0 5px 14px rgba(37, 99, 235, 0.24);
  }

  .selected .item-name,
  .selected .item-fee {
    color: white;
  }

  .detail-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.22);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.22s ease;
    z-index: 998;
  }

  .detail-backdrop.show {
    opacity: 1;
    pointer-events: auto;
  }

  .bottom-result {
    left: 0;
    right: 0;
    width: auto;
    max-width: none;
    transform: none;
    border-radius: 20px 20px 0 0;
    background: rgba(17, 24, 39, 0.96);
    box-shadow: 0 -12px 32px rgba(15, 23, 42, 0.28);
    transition: max-height 0.26s ease, bottom 0.26s ease, border-radius 0.26s ease, padding 0.26s ease, box-shadow 0.26s ease;
  }

  .bottom-result.detail-open {
    bottom: 12px;
    max-height: min(78vh, 680px);
    border-radius: 24px;
    padding: 18px 18px 22px;
    box-shadow: 0 -18px 48px rgba(15, 23, 42, 0.36);
  }

  .bottom-result.detail-open .total-row {
    font-size: 28px;
  }

  .selected-detail {
    border-top: 1px solid rgba(255,255,255,0.16);
  }

  .selected-detail-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 16px;
  }

  .selected-detail-title::after {
    content: "바텀시트 클릭 시 닫기";
    font-size: 11px;
    color: #9ca3af;
    font-weight: 600;
  }

  .selected-detail-list {
    margin-top: 10px;
    padding: 13px 14px;
    border-radius: 14px;
    background: rgba(255,255,255,0.09);
    line-height: 1.75;
  }

  .detail-toggle-btn {
    right: 18px;
    bottom: 118px;
    width: 68px;
    height: 68px;
    background: rgba(17,24,39,0.72);
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow: 0 10px 28px rgba(15, 23, 42, 0.34);
    transition: transform 0.12s ease, background-color 0.18s ease, bottom 0.26s ease, box-shadow 0.18s ease;
  }

  .detail-toggle-btn.active {
    bottom: min(78vh, 650px);
    background: rgba(255,255,255,0.9);
    color: #111827;
    border-color: rgba(17,24,39,0.08);
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.28);
  }

  @media (max-width: 480px) {
    body {
      padding-left: 12px;
      padding-right: 12px;
    }

    h1 {
      margin-left: 0;
      margin-right: 0;
      padding-top: 18px;
      padding-bottom: 18px;
      font-size: 22px;
    }

    .section {
      border-radius: 16px;
      padding: 13px;
    }

    .bottom-result {
      width: auto;
    }

    .bottom-result.detail-open {
      bottom: 10px;
      max-height: 80vh;
    }

    .detail-toggle-btn {
      right: 16px;
      bottom: 116px;
    }

    .detail-toggle-btn.active {
      bottom: min(80vh, 640px);
    }
  }

  /* 섹션 제목 sticky: 기준검사 항목 / 검사항목 / 검체 수 */
  .section {
    overflow: visible;
  }

  .section h2 {
    position: sticky;
    top: 0;
    z-index: 760;
    margin: -4px -2px 12px;
    padding: 12px 10px 9px;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 12px;
  }

  /* 검사 그룹 헤더는 섹션 제목 아래에 붙도록 배치 */
  .group-header-row {
    top: 48px;
  }

  .bottom-result {
    cursor: pointer;
  }

  .sheet-handle {
    width: 42px;
    height: 5px;
    border-radius: 999px;
    background: rgba(255,255,255,0.32);
    margin: 0 auto 10px;
  }

  .bottom-result.detail-open .sheet-handle {
    background: rgba(255,255,255,0.42);
  }


  .field-tabs {
    position: sticky;
    top: 0;
    z-index: 900;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    margin: 0 0 8px;
    padding: 5px;
    border: 1px solid rgba(17,24,39,.08);
    border-radius: 14px;
    background: rgba(255,255,255,.95);
    box-shadow: 0 5px 16px rgba(15,23,42,.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .field-tab {
    min-height: 44px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: #4b5563;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
  }
  .field-tab.active {
    background: #111827;
    color: white;
    box-shadow: 0 4px 11px rgba(15,23,42,.18);
  }


  .hidden { display: none !important; }

  .legal-toolbar {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 8px;
    margin-bottom: 14px;
  }
  .legal-search {
    width: 100%;
    min-height: 46px;
    padding: 0 14px;
    border: 1px solid #d1d5db;
    border-radius: 12px;
    background: #fff;
    color: #111827;

  }
  .legal-search:focus {
    outline: 3px solid rgba(37,99,235,.14);
    border-color: #2563eb;
  }
  .legal-count {

  }
  .legal-card {

    border-radius: 16px;
    background: #fff;
    box-shadow: 0 5px 16px rgba(15,23,42,.06);
  }
  .legal-card-header {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 12px;

  }
  .legal-card-header:hover { background: linear-gradient(135deg, #e8f2ff, #f8fafc); }

    outline: 3px solid rgba(37,99,235,.22);

    opacity: .82;
  }
  .legal-card-body.hidden { display: none; }
  .legal-category {

  }
  .legal-title-row {

  .legal-standards-toggle {
    width: 100%;
    min-height: 46px;
    padding: 11px 14px;
    border: 1px solid #c7d2fe;
    border-radius: 12px;
    background: #eef2ff;
    color: #3730a3;
    font-size: 14px;
    font-weight: 900;

    cursor: pointer;
  }

  .legal-standards-wrap {

  .legal-standards-title {

    color: #111827;

  .legal-standards-table {

    table-layout: fixed;
    font-size: 13px;
  }
  .legal-standards-table th,
  .legal-standards-table td {
    padding: 11px 12px;

    vertical-align: middle;

  .legal-standards-table th {
    background: #f8fafc;
    color: #374151;
    font-weight: 900;
  }

  .legal-standards-table td:nth-child(1) { width: 27%; font-weight: 800; }

  .legal-standards-table td:nth-child(2) { width: 45%; }

  .legal-standards-table td:nth-child(3) { width: 28%; }

        <p>③ 시장ㆍ군수ㆍ구청장은 법 제20조제1항에 따른 수질검사 결과 수소이온농도를 제외한 모든 항목이 별표 9에 따른 지하수 수질기준의 100분의 70 이하이고, 수질오염의 우려가 없다고 인정되는 지하수개발ㆍ이용시설에 대해서는 제2항에 따른 수질검사의 주기를 조정할 수 있다.</p>
        <p>④ 법 제20조제1항에 따라 수질검사를 받으려는 자는 수질검사전문기관에 수질검사를 신청해야 하며, 신청을 받은 수질검사전문기관은 별지 제40호서식의 지하수수질검사 접수ㆍ처리기록부에 그 사실을 기록해야 한다.</p>
        <p>⑤ 제4항에 따른 신청을 받은 수질검사전문기관은 수질검사를 위한 시료채취기간을 정하여 시료채취 실시 3일 전까지 수질검사를 받으려는 자와 시장ㆍ군수ㆍ구청장에게 각각 통보해야 한다.</p>
        <p>⑥ 수질검사전문기관은 수질검사를 실시하는 경우에는 수질검사 신청인이 보는 앞에서 시료채취를 한 후 채취한 시료를 봉인(封印)해야 하며, 별지 제41호서식의 지하수수질검사시료 채취확인서를 작성해야 한다.</p>
        <p>⑦ 제5항에 따른 통보를 받은 시장ㆍ군수ㆍ구청장은 소속 공무원으로 하여금 제6항에 따른 시료채취를 참관하게 할 수 있다.</p>
        <p>⑧ 제4항부터 제7항까지의 규정에도 불구하고 도서(島嶼)ㆍ산간 지역 등 수질검사 대상 지하수가 소재하는 관할 지역의 시장ㆍ군수ㆍ구청장이 수질검사전문기관에서 시료채취가 어렵다고 인정하는 지역의 경우에는 시ㆍ군ㆍ구 소속 공무원이 시료채취 및 봉인을 한 후 수질검사전문기관에 수질검사를 의뢰할 수 있다. 이 경우 수질검사의 절차에 관하여는 제4항부터 제7항까지의 규정을 준용하며, “수질검사전문기관”은 “시장ㆍ군수ㆍ구청장”으로, “수질검사를 받으려는 자와 시장ㆍ군수ㆍ구청장”은 “수질검사를 받으려는 자”로 본다.</p>
        <p>⑨ 제8항에 따라 시료채취 및 봉인을 하는 공무원은 국립환경인재개발원 또는 수질검사전문기관이 환경분야 시료채취 및 수질분석에 관하여 실시하는 교육을 8시간 이상 이수해야 한다.</p>

        <p><strong>지하수법 시행령 제31조(수질검사의 항목 등)</strong></p>
        <p>① 법 제20조제3항에 따른 수질검사의 항목은 다음 각 호와 같다. &lt;개정 2021. 1. 5., 2025. 10. 1.&gt;</p>
        <p>1. 먹는물의 경우: 「먹는물관리법」 제5조에 따른 먹는물의 수질기준 설정 항목</p>
        <p>2. 생활용수, 공업용수 및 농ㆍ어업용수의 경우: 기후에너지환경부령으로 정하는 지하수의 수질기준 설정 항목</p>
        <p>② 법 제20조제3항에 따른 수질검사의 방법은 다음 각 호와 같다. &lt;개정 2021. 1. 5.&gt;</p>
        <p>1. 먹는물의 경우: 「환경분야 시험ㆍ검사 등에 관한 법률」 제6조제1항제6호에 따른 환경오염공정시험기준에 따를 것</p>
        <p>2. 생활용수, 공업용수 및 농ㆍ어업용수의 경우: 「환경분야 시험ㆍ검사 등에 관한 법률」 제6조제1항제5호에 따른 환경오염공정시험기준에 따를 것</p>
        <p>[전문개정 2011. 12. 30.]</p>

        <p><strong>지하수법 시행규칙 제41조(지하수의 수질기준)</strong></p>
        <p>법 제20조제2항에서 “기후에너지환경부령으로 정하는 수질기준”이란 별표 9의 기준을 말한다. &lt;개정 2025. 10. 1.&gt;</p>

function toggleLegalStandards(refId, button) {
  const content = document.getElementById(`standards-${refId}`);
  const ref = legalReferences.find(item => item.id === refId);
  if (!content || !ref) return;

  const isOpen = button.getAttribute("aria-expanded") === "true";
  if (isOpen) {
    button.setAttribute("aria-expanded", "false");
    content.classList.add("hidden");
    button.firstChild.textContent = "수질기준 및 검사방법 펼쳐보기";
    return;
  }

  if (!content.dataset.rendered) {
    content.innerHTML = createLegalStandardsHtml(ref);
    content.dataset.rendered = "true";
  }

  button.setAttribute("aria-expanded", "true");
  content.classList.remove("hidden");
  button.firstChild.textContent = "수질기준 및 검사방법 접기";
}

function toggleLegalCard(cardId) {
  const card = document.getElementById(`legal-card-${cardId}`);
  if (!card) return;

  const body = card.querySelector('.legal-card-body');
  const toggle = card.querySelector('.legal-card-toggle');
  if (!body || !toggle) return;

  const isOpen = card.classList.contains('open');
  card.classList.toggle('open', !isOpen);
  body.classList.toggle('hidden', isOpen);
  toggle.textContent = isOpen ? '◀' : '▼';
  toggle.setAttribute('aria-expanded', String(!isOpen));
  card.querySelector('.legal-card-header')?.setAttribute('aria-expanded', String(!isOpen));
}

function renderLegalReferences(query = "") {
  const area = document.getElementById("legalCardArea");
  const normalized = query.trim().toLowerCase();
  const orderMap = new Map(legalDisplayOrder.map((id, index) => [id, index]));
  const orderedReferences = [...legalReferences].sort((a, b) => {
    const aOrder = orderMap.has(a.id) ? orderMap.get(a.id) : Number.MAX_SAFE_INTEGER;
    const bOrder = orderMap.has(b.id) ? orderMap.get(b.id) : Number.MAX_SAFE_INTEGER;
    return aOrder - bOrder;
  });

  const filtered = orderedReferences.filter(ref => {
    const text = [
      ref.category, ref.title,
      ref.requestBasis.lawName, stripHtml(ref.requestBasis.content),
      ref.detailBasis.lawName, stripHtml(ref.detailBasis.content),
      ...ref.keywords,
      ...ref.attachments.map(item => item.name),
      ...(ref.waterStandards || []).flatMap(group => [
        group.name,
        ...group.rows.flatMap(row => [row.item, row.standard, row.method])
      ])
    ].join(" ").toLowerCase();
    return !normalized || text.includes(normalized);
  });

  document.getElementById("legalResultCount").textContent = filtered.length;
  area.innerHTML = "";

  if (filtered.length === 0) {
    area.innerHTML = '<div class="legal-empty">검색 결과가 없습니다.</div>';
    return;
  }

  filtered.forEach(ref => {
    const card = document.createElement("article");
    card.className = "legal-card";
    const attachmentLinks = ref.attachments.map(item =>
      `<a class="legal-link primary" href="${item.url}" target="_blank" rel="noopener noreferrer">${item.name} 보기</a>`
    ).join("");
    const standardTypes = Array.isArray(ref.testStandard)
      ? ref.testStandard
      : ref.testStandard ? [ref.testStandard] : [];
    const standardBadge = standardTypes.map(type =>
      type === "drinking"
        ? '<span class="test-standard-badge drinking">먹</span>'
        : type === "water"
          ? '<span class="test-standard-badge water">수</span>'
          : ''
    ).join("");

    const standardsHtml = (ref.waterStandards || []).length
      ? `
        <section class="legal-block">
          <div class="legal-label">C. 수질기준 및 공정시험방법</div>
          <button type="button"
                  class="legal-standards-toggle"
                  aria-expanded="false"
                  aria-controls="standards-${ref.id}"
                  onclick="toggleLegalStandards('${ref.id}', this)">
            수질기준 및 검사방법 펼쳐보기
          </button>
          <div id="standards-${ref.id}" class="legal-standards-content hidden"></div>
        </section>
      `
      : '';

    card.id = `legal-card-${ref.id}`;
    card.innerHTML = `
      <div class="legal-card-header"
           role="button"
           tabindex="0"
           aria-expanded="false"
           aria-controls="legal-body-${ref.id}"
           onclick="toggleLegalCard('${ref.id}')"
           onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleLegalCard('${ref.id}');}">
        <div class="legal-card-heading">
          <div class="legal-category">${ref.category}</div>
          <div class="legal-title-row">
            <h3>${ref.title}</h3>
            ${standardBadge}
          </div>
        </div>
        <button type="button"
                class="legal-card-toggle"
                aria-label="카드 내용 열기"
                aria-expanded="false"
                tabindex="-1">◀</button>
      </div>
      <div id="legal-body-${ref.id}" class="legal-card-body hidden">
        <section class="legal-block">
          <div class="legal-label">${ref.requestBasis.label}</div>
          <div class="legal-law-name">${ref.requestBasis.lawName}</div>
          <div class="legal-text">${ref.requestBasis.content}</div>
          <div class="legal-links">
            <a class="legal-link" href="${ref.requestBasis.url}" target="_blank" rel="noopener noreferrer">법령 원문 보기</a>
          </div>
        </section>
        <section class="legal-block">
          <div class="legal-label">${ref.detailBasis.label}</div>
          <div class="legal-law-name">${ref.detailBasis.lawName}</div>
          <div class="legal-text">${ref.detailBasis.content}</div>
          <div class="legal-links">
            <a class="legal-link" href="${ref.detailBasis.url}" target="_blank" rel="noopener noreferrer">시행규칙 원문 보기</a>
            ${attachmentLinks}
          </div>
        </section>
        ${standardsHtml}
        <div class="legal-note">내용 확인일: ${ref.checkedDate} · 최신 개정 내용은 연결된 국가법령정보센터 원문에서 확인하세요.</div>
      </div>
    `;
    area.appendChild(card);
  });
}

function changeField(field) {
  if (!["drinking", "pollution", "legal"].includes(field) || field === currentField) return;

  if (currentField !== "legal") {
    fieldStates[currentField].sampleCount = sampleCount;
  }
  closeDetailView();
  currentField = field;

  document.querySelectorAll(".field-tab").forEach(tab => {
    tab.classList.toggle("active", tab.dataset.field === field);
  });

  const isLegal = field === "legal";
  document.getElementById("calculatorContent").classList.toggle("hidden", isLegal);
  document.getElementById("legalContent").classList.toggle("hidden", !isLegal);
  document.getElementById("bottomResult").classList.toggle("hidden", isLegal);
  document.getElementById("detailBackdrop").classList.toggle("hidden", isLegal);

  if (isLegal) {
    renderLegalReferences(document.getElementById("legalSearch").value);
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }

  items = datasets[field].items;
  presets = datasets[field].presets;
  oneFeeGroups = datasets[field].oneFeeGroups;
  toggleSelectButtons = datasets[field].toggleSelectButtons;
  dependencyFreeRules = datasets[field].dependencyFreeRules;

  selectedItems = fieldStates[field].selectedItems;
  activePresets = fieldStates[field].activePresets;
  collapsedGroups = fieldStates[field].collapsedGroups;
  sampleCount = fieldStates[field].sampleCount;

  renderPresets();
  renderItems();
  renderSampleButtons();
  calculateTotal();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderPresets() {
  const presetArea = document.getElementById("presetArea");
  presetArea.innerHTML = "";

  presets.forEach(preset => {
    const btn = document.createElement("button");
    btn.className = "preset-btn span-1";

    /*
      묶음검사 버튼의 선택 상태는 실제 항목 선택 여부와 분리해서 관리한다.
      예: 지하수 먹는물 46항목이 상수도 59항목에 모두 포함되어도
      지하수 버튼과 상수도 버튼이 서로 자동으로 연동되어 보이지 않게 한다.
    */
    const isActivePreset = activePresets.has(preset.name);

    if (isActivePreset) {
      btn.classList.add("selected");
    }

    btn.innerHTML = `
      <span class="item-name">${isActivePreset ? "✓ " : ""}${preset.name}</span>
    `;

    btn.onclick = () => {
      if (isActivePreset) {
        preset.items.forEach(id => selectedItems.delete(id));
        activePresets.delete(preset.name);
      } else {
        preset.items.forEach(id => selectedItems.add(id));
        activePresets.add(preset.name);
      }

      renderPresets();
      renderItems();
      calculateTotal();
    };

    presetArea.appendChild(btn);
  });

  const clearBtn = document.createElement("button");
  clearBtn.className = "preset-btn span-1";
  clearBtn.textContent = "전체 해제";

  clearBtn.onclick = () => {
    selectedItems.clear();
    activePresets.clear();
    renderPresets();
    renderItems();
    calculateTotal();
  };

  presetArea.appendChild(clearBtn);
}


function isDependencyFree(item) {
  return dependencyFreeRules.some(rule => {
    const isTarget =
      rule.targetId === item.id ||
      (rule.targetAnyIds && rule.targetAnyIds.includes(item.id));

    if (!isTarget) return false;

    if (rule.requiredId && selectedItems.has(rule.requiredId)) {
      return true;
    }

    if (rule.requiredAnyIds && rule.requiredAnyIds.some(id => selectedItems.has(id))) {
      return true;
    }

    return false;
  });
}

function getOneFeeGroup(item) {
  return oneFeeGroups.find(group => group.itemIds.includes(item.id));
}

function isOneFeeGroupExempt(item) {
  const group = getOneFeeGroup(item);
  if (!group) return false;

  const selectedInGroup = group.itemIds.filter(id => selectedItems.has(id));

  if (selectedInGroup.length === 0) {
    return false;
  }

  // 그룹 내에서 선택된 첫 번째 항목만 수수료를 계산하고, 나머지는 면제 처리
  return selectedInGroup[0] !== item.id;
}

function shouldShowExempt(item) {
  return isDependencyFree(item) || isOneFeeGroupExempt(item);
}

function getEffectiveFee(item) {
  if (shouldShowExempt(item)) {
    return 0;
  }

  return item.fee;
}

function getFeeText(item) {
  if (shouldShowExempt(item) && item.fee > 0) {
    return `<span class="fee-exempt">면제</span>`;
  }

  return `${item.fee.toLocaleString()}원`;
}

function renderToggleButton(toggle) {
  const btn = document.createElement("button");
  btn.className = `item-btn span-${toggle.span || 1}`;

  const selectedCount = toggle.itemIds.filter(id => selectedItems.has(id)).length;
  const allSelected = selectedCount === toggle.itemIds.length;
  const someSelected = selectedCount > 0 && !allSelected;

  if (allSelected) {
    btn.classList.add("selected");
  } else if (someSelected) {
    btn.classList.add("partial-selected");
  }

  btn.innerHTML = `
    <span class="item-name">${allSelected ? "✓ " : ""}${toggle.name}</span>
    <span class="item-fee">${selectedCount}/${toggle.itemIds.length} 선택</span>
  `;

  btn.onclick = () => {
    if (allSelected) {
      toggle.itemIds.forEach(id => selectedItems.delete(id));
    } else {
      toggle.itemIds.forEach(id => selectedItems.add(id));
    }

    activePresets.clear();
    renderPresets();
    renderItems();
    calculateTotal();
  };

  return btn;
}

function getGridColumnCount() {
  if (window.matchMedia("(max-width: 480px)").matches) return 2;
  if (window.matchMedia("(max-width: 768px)").matches) return 3;
  return 4;
}

function getSafeSpan(span) {
  return Math.min(span || 1, getGridColumnCount());
}

function createEmptyCell() {
  const empty = document.createElement("div");
  empty.className = "empty-cell";
  return empty;
}

function padRowToEnd(grid, rowFill) {
  const columns = getGridColumnCount();

  while (rowFill > 0 && rowFill < columns) {
    grid.appendChild(createEmptyCell());
    rowFill += 1;
  }

  return 0;
}

function appendButtonToGrid(grid, btn, span, rowFill) {
  const columns = getGridColumnCount();
  const safeSpan = Math.min(span || 1, columns);

  if (rowFill + safeSpan > columns) {
    rowFill = padRowToEnd(grid, rowFill);
  }

  grid.appendChild(btn);
  rowFill += safeSpan;

  if (rowFill >= columns) {
    rowFill = 0;
  }

  return rowFill;
}

function appendToggleAtRowEnd(grid, toggle, rowFill) {
  const columns = getGridColumnCount();
  const toggleSpan = getSafeSpan(toggle.span || 1);

  if (toggleSpan >= columns) {
    rowFill = padRowToEnd(grid, rowFill);
    grid.appendChild(renderToggleButton(toggle));
    return 0;
  }

  if (rowFill + toggleSpan > columns) {
    rowFill = padRowToEnd(grid, rowFill);
  }

  while (rowFill < columns - toggleSpan) {
    grid.appendChild(createEmptyCell());
    rowFill += 1;
  }

  grid.appendChild(renderToggleButton(toggle));
  rowFill += toggleSpan;

  if (rowFill >= columns) {
    rowFill = 0;
  }

  return rowFill;
}

function createItemButton(item) {
  const btn = document.createElement("button");
  btn.className = `item-btn span-${item.span || 1}`;

  if (selectedItems.has(item.id)) {
    btn.classList.add("selected");
  }

  btn.innerHTML = `
    <span class="item-name">${selectedItems.has(item.id) ? "✓ " : ""}${item.name}</span>
    <span class="item-fee">${getFeeText(item)}</span>
  `;

  btn.onclick = () => {
    if (selectedItems.has(item.id)) {
      selectedItems.delete(item.id);
    } else {
      selectedItems.add(item.id);
    }

    activePresets.clear();
    renderPresets();
    renderItems();
    calculateTotal();
  };

  return btn;
}

function getTogglesByFirstItemId(groupName) {
  const result = {};

  toggleSelectButtons
    .filter(toggle => toggle.group === groupName)
    .forEach(toggle => {
      const firstItemId = toggle.itemIds[0];

      if (!result[firstItemId]) {
        result[firstItemId] = [];
      }

      result[firstItemId].push(toggle);
    });

  return result;
}

function renderItems() {
  const itemArea = document.getElementById("itemArea");
  itemArea.innerHTML = "";

  const groups = {};

  items.forEach(item => {
    if (!groups[item.group]) {
      groups[item.group] = [];
    }
    groups[item.group].push(item);
  });

  Object.keys(groups).forEach(groupName => {
    if (collapsedGroups[groupName] === undefined) {
      collapsedGroups[groupName] = false;
    }

    const selectedInGroup = groups[groupName].filter(item => selectedItems.has(item.id)).length;
    const totalInGroup = groups[groupName].length;

    const groupHeaderRow = document.createElement("div");
    groupHeaderRow.className = "group-header-row";

    const groupHeader = document.createElement("button");
    groupHeader.className = "group-header";
    const selectedCountHtml = selectedInGroup > 0
      ? `<span class="group-count-selected">${selectedInGroup}</span>`
      : `${selectedInGroup}`;

    groupHeader.innerHTML =
      `${collapsedGroups[groupName] ? "▶" : "▼"} ${groupName} ` +
      `(${selectedCountHtml}/${totalInGroup})`;

    groupHeader.onclick = () => {
      collapsedGroups[groupName] = !collapsedGroups[groupName];
      renderItems();
    };

    const groupClearBtn = document.createElement("button");
    groupClearBtn.className = "group-clear-btn";
    groupClearBtn.textContent = selectedInGroup === 0 ? "전체선택" : "전체해제";
    groupClearBtn.onclick = () => {
      if (selectedInGroup === 0) {
        groups[groupName].forEach(item => selectedItems.add(item.id));
      } else {
        groups[groupName].forEach(item => selectedItems.delete(item.id));
      }
      activePresets.clear();
      renderPresets();
      renderItems();
      calculateTotal();
    };

    groupHeaderRow.appendChild(groupHeader);
    groupHeaderRow.appendChild(groupClearBtn);
    itemArea.appendChild(groupHeaderRow);

    if (!collapsedGroups[groupName]) {
      const grid = document.createElement("div");
      grid.className = "button-grid";

      let rowFill = 0;

      const groupToggles = toggleSelectButtons.filter(toggle => toggle.group === groupName);
      groupToggles.forEach(toggle => {
        rowFill = appendButtonToGrid(grid, renderToggleButton(toggle), toggle.span || 1, rowFill);
      });

      // 토글 버튼들은 그룹 맨 앞에 모아 배치하고, 다음 줄부터 개별 항목을 표시한다.
      if (groupToggles.length > 0) {
        rowFill = padRowToEnd(grid, rowFill);
      }

      groups[groupName].forEach(item => {
        rowFill = appendButtonToGrid(grid, createItemButton(item), item.span || 1, rowFill);

      });

      itemArea.appendChild(grid);
    }
  });
}

function changeSampleCount(delta) {
  const next = Math.max(1, Math.min(99, sampleCount + delta));
  if (next === sampleCount) return;
  sampleCount = next;
  fieldStates[currentField].sampleCount = sampleCount;
  renderSampleButtons();
  calculateTotal();
}

function renderSampleButtons() {
  const sampleArea = document.getElementById("sampleArea");
  sampleArea.innerHTML = "";

  const wrapper = document.createElement("div");
  wrapper.className = "sample-control";

  const minusBtn = document.createElement("button");
  minusBtn.className = "sample-step-btn";
  minusBtn.textContent = "−";
  minusBtn.onclick = () => changeSampleCount(-1);

  const numberInput = document.createElement("input");
  numberInput.className = "sample-number";
  numberInput.type = "number";
  numberInput.min = "1";
  numberInput.max = "99";
  numberInput.value = sampleCount;

  numberInput.oninput = () => {
    const value = Number(numberInput.value);
    if (!Number.isNaN(value) && value >= 1) {
      sampleCount = Math.min(99, Math.floor(value));
      fieldStates[currentField].sampleCount = sampleCount;
      calculateTotal();
    }
  };

  numberInput.onblur = () => {
    if (!numberInput.value || Number(numberInput.value) < 1) {
      sampleCount = 1;
    }
    fieldStates[currentField].sampleCount = sampleCount;
    numberInput.value = sampleCount;
    calculateTotal();
  };

  const plusBtn = document.createElement("button");
  plusBtn.className = "sample-step-btn";
  plusBtn.textContent = "+";
  plusBtn.onclick = () => changeSampleCount(1);

  wrapper.appendChild(minusBtn);
  wrapper.appendChild(numberInput);
  wrapper.appendChild(plusBtn);

  const help = document.createElement("div");
  help.className = "sample-help";
  help.textContent = "− / + 버튼 또는 숫자 직접 입력";

  sampleArea.appendChild(wrapper);
  sampleArea.appendChild(help);
}

function stripHtml(html) {
  const temp = document.createElement("div");
  temp.innerHTML = html;
  return temp.textContent || temp.innerText || "";
}

function updateSelectedDetailList(selected) {
  const list = document.getElementById("selectedDetailList");
  list.innerHTML = "";

  if (selected.length === 0) {
    const empty = document.createElement("div");
    empty.className = "selected-detail-empty";
    empty.textContent = "선택된 검사항목이 없습니다.";
    list.appendChild(empty);
    return;
  }

  // 작성된 검사항목 순서(items 배열 순서)대로 항목명만 콤마로 구분해 표시
  const names = selected.map(item => stripHtml(item.name));
  const text = document.createElement("div");
  text.className = "selected-detail-item";
  text.textContent = names.join(", ");
  list.appendChild(text);
}

function setDetailView(open) {
  detailOpen = open;

  const bottom = document.querySelector(".bottom-result");
  const backdrop = document.getElementById("detailBackdrop");

  bottom.classList.toggle("detail-open", detailOpen);
  backdrop.classList.toggle("show", detailOpen);
}

function toggleDetailView() {
  setDetailView(!detailOpen);
}

function toggleDetailViewFromSheet(event) {
  // 바텀시트 자체를 눌렀을 때 열기/닫기 전환
  // 상세 목록 내부 텍스트를 드래그하거나 스크롤하는 경우에는 동작을 방해하지 않도록 최소 처리
  toggleDetailView();
}

function closeDetailView() {
  setDetailView(false);
}

function calculateTotal() {
  const selected = items.filter(item => selectedItems.has(item.id));

  updateSelectedDetailList(selected);

  const subtotal = selected.reduce((sum, item) => sum + getEffectiveFee(item), 0);
  const actualItemCount = selected.reduce((sum, item) => sum + item.count, 0);
  const total = subtotal * sampleCount;

  document.getElementById("actualItemCount").textContent = actualItemCount;
  document.getElementById("sampleCountText").textContent = sampleCount;
  document.getElementById("subtotal").textContent = subtotal.toLocaleString();
  document.getElementById("total").textContent = total.toLocaleString();
}

renderPresets();
renderItems();
renderSampleButtons();
calculateTotal();
renderLegalReferences();

document.getElementById("legalSearch").addEventListener("input", event => {
  renderLegalReferences(event.target.value);
});

window.addEventListener("resize", () => {
  renderItems();
});


// 모바일에서 바텀시트를 아래로 스와이프하면 닫힘
let sheetTouchStartY = 0;
const bottomSheet = document.getElementById("bottomResult");

bottomSheet.addEventListener("touchstart", function(event) {
  if (!detailOpen) return;
  sheetTouchStartY = event.touches[0].clientY;
}, { passive: true });

bottomSheet.addEventListener("touchend", function(event) {
  if (!detailOpen) return;
  const touchEndY = event.changedTouches[0].clientY;
  if (touchEndY - sheetTouchStartY > 70) {
    closeDetailView();
  }
}, { passive: true });



document.querySelectorAll(".field-tab").forEach(tab => {
  tab.addEventListener("click", () => changeField(tab.dataset.field));
});


// 모바일 Safari에서 더블탭 확대와 핀치 확대를 최대한 방지
let lastTouchEnd = 0;
document.addEventListener("touchend", function(event) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) {
    event.preventDefault();
  }
  lastTouchEnd = now;
}, { passive: false });

document.addEventListener("gesturestart", function(event) {
  event.preventDefault();
}, { passive: false });

</script>
