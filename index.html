<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>수질조사과 참고자료</title>

<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 16px 16px 130px;
    background: #f7f8fa;
    color:#111827;
  }

  h1 {
    text-align: center;
    font-size: 24px;
    margin: 10px 0 20px;
    color:#111827;
    white-space: nowrap;
    overflow-x:auto;
  }

  h2 {
    font-size: 18px;
    margin: 0 0 12px;
    border-bottom: 2px solid #333;
    padding-bottom: 6px;
  }

  .section {
    background: white;
    padding: 14px;
    margin-bottom: 16px;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .button-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  button {
    font-family: inherit;
    color:#111827;
    -webkit-appearance:none;
    appearance:none;
  }

  .item-btn, .preset-btn, .sample-btn {
    min-height: 58px;
    border: 1px solid #bbb;
    border-radius: 10px;
    background: #f2f2f2;
    cursor: pointer;
    text-align: center;
    padding: 8px;
  }

  .item-name {
    display: block;
    font-weight: bold;
    font-size: 14px;
    line-height: 1.2;
    white-space: nowrap;
    overflow-x:auto;
  }

  .item-name br {
    display: block;
  }

  .item-fee {
    display: block;
    margin-top: 4px;
    font-size: 12px;
    color: #555;
  }

  .selected {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
  }

  .selected .item-fee {
    color: #e0e7ff;
  }

  .partial-selected {
    background: #fef3c7;
    border-color: #f59e0b;
  }

  .empty-cell {
    visibility: hidden;
    min-height: 58px;
  }

  .item-name small,
  .sub {
    font-size: 11px;
    font-weight: normal;
    line-height: 1.2;
  }

  .fee-combo-note { font-size:10px; font-weight:800; color:#b45309; }
  .selected .fee-combo-note { color:#fef08a; }

  .fee-exempt {
    color: #dc2626;
    font-weight: bold;
  }

  .selected .fee-exempt {
    color: #fecaca;
  }

  .group-header-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
    margin: 12px 0 8px;
  }

  .group-header {
    width: 100%;
    padding: 10px 12px;
    border: none;
    border-radius: 8px;
    background: #e5e7eb;
    font-weight: bold;
    font-size: 15px;
    text-align: left;
    cursor: pointer;
  }


  .group-count-selected {
    color: #dc2626;
    font-weight: 800;
  }

  .group-clear-btn {
    min-width: 74px;
    padding: 8px 10px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    background: #ffffff;
    color: #374151;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }

  .group-clear-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .bottom-result {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    background: #111827;
    color: white;
    padding: 14px 18px;
    box-shadow: 0 -3px 10px rgba(0,0,0,0.25);
    z-index: 999;
  }

  .bottom-row {
    display: flex;
    justify-content: space-between;
    margin-bottom: 4px;
    font-size: 14px;
  }

  .total-row {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 22px;
    font-weight: bold;
  }

  #total {
    color: #facc15;
  }

  .bottom-result.detail-open {
    max-height: 70vh;
    overflow-y: auto;
    border-radius: 18px 18px 0 0;
    padding-bottom: 22px;
  }

  .selected-detail {
    display: none;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid rgba(255,255,255,0.22);
  }

  .bottom-result.detail-open .selected-detail {
    display: block;
  }

  .selected-detail-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 8px;
  }

  .selected-detail-list {
    padding: 9px 10px;
    border-radius: 8px;
    background: rgba(255,255,255,0.08);
    font-size: 13px;
    line-height: 1.6;
    word-break: keep-all;
  }

  .selected-detail-item {
    display: inline;
  }

  .selected-detail-empty {
    color: #d1d5db;
    font-size: 13px;
    padding: 8px 0;
  }

  .detail-toggle-btn {
    position: fixed;
    right: 18px;
    bottom: 112px;
    width: 68px;
    height: 68px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.45);
    background: rgba(17,24,39,0.72);
    color: white;
    font-size: 13px;
    font-weight: bold;
    line-height: 1.2;
    z-index: 1001;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .detail-toggle-btn.active {
    background: rgba(250,204,21,0.85);
    color: #111827;
    border-color: rgba(250,204,21,0.95);
  }

  .sample-control {
    display: grid;
    grid-template-columns: 64px 1fr 64px;
    gap: 8px;
    align-items: center;
  }

  .sample-step-btn {
    min-height: 56px;
    border: 1px solid #bbb;
    border-radius: 10px;
    background: #f2f2f2;
    font-size: 24px;
    font-weight: bold;
    cursor: pointer;
  }

  .sample-number {
    min-height: 56px;
    border: 2px solid #2563eb;
    border-radius: 10px;
    background: white;
    color: #111827;
    font-size: 24px;
    font-weight: bold;
    text-align: center;
  }

  .sample-help {
    margin-top: 8px;
    color: #666;
    font-size: 12px;
    text-align: center;
  }

  @media (max-width: 480px) {
    .button-grid {
      grid-template-columns: repeat(2, 1fr);
    }

    .span-2, .span-3, .span-4 {
      grid-column: span 2;
    }

    .item-name {
      font-size: 12px;
    }

    .item-name small,
    .sub {
      font-size: 10px;
    }
  }

  @media (min-width: 481px) and (max-width: 768px) {
    .button-grid {
      grid-template-columns: repeat(3, 1fr);
    }

    .span-2 { grid-column: span 2; }
    .span-3, .span-4 { grid-column: span 3; }

    .item-name {
      font-size: 13px;
    }
  }

  @media (min-width: 769px) {
    .span-2 { grid-column: span 2; }
    .span-3 { grid-column: span 3; }
    .span-4 { grid-column: span 4; }
  }


  /* ===== App-like minimal UI override ===== */

    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }

    border: 1px solid rgba(17, 24, 39, 0.06);

  .preset-btn,
  .sample-btn,
  .sample-step-btn,

  .sample-step-btn:active,

  .item-btn,

  .item-btn:hover,

  }

  .group-header-row {
    position: sticky;
    top: 0;
    z-index: 700;
    padding: 5px 0;
    margin: 10px 0 8px;
    background: rgba(247, 248, 250, 0.94);

  }

  .group-header {
    background: #eef0f3;

  .detail-backdrop {
    position: fixed;

    transition: opacity 0.22s ease;

  }

  .detail-backdrop.show {
    opacity: 1;
    pointer-events: auto;
  }

  .bottom-result {
    left: 0;
    right: 0;
    width: auto;
    max-width: none;
    transform: none;
    border-radius: 20px 20px 0 0;
    background: rgba(17, 24, 39, 0.96);
    box-shadow: 0 -12px 32px rgba(15, 23, 42, 0.28);
    transition: max-height 0.26s ease, bottom 0.26s ease, border-radius 0.26s ease, padding 0.26s ease, box-shadow 0.26s ease;
  }

  .bottom-result.detail-open {
    bottom: 12px;
    max-height: min(78vh, 680px);
    border-radius: 24px;
    padding: 18px 18px 22px;
    box-shadow: 0 -18px 48px rgba(15, 23, 42, 0.36);
  }

  .bottom-result.detail-open .total-row {
    font-size: 28px;
  }

  .selected-detail {
    border-top: 1px solid rgba(255,255,255,0.16);
  }

  .selected-detail-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 16px;
  }

  .selected-detail-title::after {
    content: "바텀시트 클릭 시 닫기";
    font-size: 11px;
    color: #9ca3af;
    font-weight: 600;
  }

  .selected-detail-list {
    margin-top: 10px;
    padding: 13px 14px;
    border-radius: 14px;
    background: rgba(255,255,255,0.09);
    line-height: 1.75;
  }

  .detail-toggle-btn {
    right: 18px;
    bottom: 118px;
    width: 68px;
    height: 68px;
    background: rgba(17,24,39,0.72);
    border: 1px solid rgba(255,255,255,0.35);
    box-shadow: 0 10px 28px rgba(15, 23, 42, 0.34);
    transition: transform 0.12s ease, background-color 0.18s ease, bottom 0.26s ease, box-shadow 0.18s ease;
  }

  .detail-toggle-btn.active {
    bottom: min(78vh, 650px);
    background: rgba(255,255,255,0.9);
    color: #111827;
    border-color: rgba(17,24,39,0.08);
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.28);
  }

  @media (max-width: 480px) {
    body {
      padding-left: 12px;
      padding-right: 12px;
    }

    h1 {
      margin-left: 0;
      margin-right: 0;
      padding-top: 18px;
      padding-bottom: 18px;
      font-size: 22px;
    }

    .section {
      border-radius: 16px;
      padding: 13px;
    }

    .bottom-result {
      width: auto;
    }

    .bottom-result.detail-open {
      bottom: 10px;
      max-height: 80vh;
    }

    .detail-toggle-btn {
      right: 16px;
      bottom: 116px;
    }

    .detail-toggle-btn.active {
      bottom: min(80vh, 640px);
    }
  }

  /* 섹션 제목 sticky: 기준검사 항목 / 검사항목 / 검체 수 */
  .section {
    overflow: visible;
  }

  .section h2 {
    position: sticky;
    top: 0;
    z-index: 760;
    margin: -4px -2px 12px;
    padding: 12px 10px 9px;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 12px;
  }

  /* 검사 그룹 헤더는 섹션 제목 아래에 붙도록 배치 */
  .group-header-row {

  }

  .bottom-result {

  }

  .sheet-handle {

  .field-tabs {
    position: sticky;

  .field-tab {

  }


  .hidden { display: none !important; }

  .legal-search {

  }
  .legal-card-header {

  .legal-standards-toggle {
    width: 100%;
    min-height: 46px;
    padding: 11px 14px;

    border-radius: 12px;

  .legal-standards-wrap {

  .legal-standards-table {

  .legal-standards-table th,

  .cart-action-feedback { display:none; margin:10px 0 0; padding:12px; border-radius:10px; background:#dcfce7; color:#166534; font-size:13px; font-weight:800; }
  .cart-action-feedback.show { display:block; }
  /* ===== 검사 의뢰 장바구니 ===== */
  .field-tabs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .add-cart-btn { display:block; width:100%; min-height:46px; margin-top:12px; border:0; border-radius:12px; background:#facc15; color:#111827; font-weight:900; font-size:15px; cursor:pointer; }
  .add-cart-btn:disabled { background:#6b7280; color:#e5e7eb; cursor:not-allowed; }
  .bottom-result { cursor:default; }
  .sheet-handle, .bottom-row, .total-row, .selected-detail { cursor:pointer; }
  .detail-toggle-btn { bottom: 164px; }
  .detail-toggle-btn.active { bottom:min(78vh, 650px); }
  body { padding-bottom: 190px; }
  .cart-section { max-width:920px; margin:0 auto 24px; }
  .cart-heading-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .cart-heading-main { display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
  .cart-title-input { min-width:0; flex:1; max-width:260px; height:42px; padding:0 13px; border:1px solid #dbe3ef; border-radius:12px; background:#fff; color:#0f172a; font-size:22px; font-weight:900; line-height:1; }
  .cart-title-input:focus { outline:3px solid rgba(37,99,235,.16); border-color:#93c5fd; }
  .cart-heading-count { font-size:13px; font-weight:800; color:#64748b; white-space:nowrap; }
  .cart-clear-btn { min-height:38px; padding:8px 12px; border:1px solid #fecaca; border-radius:10px; background:#fff7f7; color:#b91c1c; font-size:13px; font-weight:800; cursor:pointer; }
  .cart-clear-btn:disabled { opacity:.4; cursor:default; }
    .cart-empty { padding:50px 16px; border:1px dashed #cbd5e1; border-radius:14px; text-align:center; color:#475569; font-weight:800; }
  .cart-empty div { margin-top:8px; font-size:12px; font-weight:400; line-height:1.6; }
  .cart-entry { margin-bottom:14px; padding:16px; border:1px solid #e2e8f0; border-radius:14px; background:#fff; box-shadow:0 4px 14px rgba(15,23,42,.04); }
  .cart-entry-top { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .cart-entry-title { font-size:19px; font-weight:900; line-height:1.35; color:#0f172a; }
  .cart-entry-meta { display:none; }
  .cart-remove-btn { flex:0 0 auto; padding:7px 10px; border:1px solid #e2e8f0; border-radius:8px; background:#fff; font-size:12px; color:#b91c1c; font-weight:800; cursor:pointer; }
  .cart-entry-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:12px; font-size:14px; }
  .cart-entry-row strong { font-variant-numeric:tabular-nums; white-space:nowrap; }
  .cart-qty-control { display:flex; align-items:center; gap:7px; }
  .cart-qty-control button { width:34px; height:34px; border:1px solid #cbd5e1; border-radius:8px; background:#f8fafc; font-size:19px; font-weight:800; cursor:pointer; }
  .cart-qty-control button:disabled { opacity:.35; cursor:default; }
  .cart-qty-control input { width:58px; height:34px; border:1px solid #cbd5e1; border-radius:8px; text-align:center; font-size:15px; font-weight:800; color:#0f172a; }
  .cart-qty-control input::-webkit-inner-spin-button { opacity:1; }
  .cart-entry-subtotal { padding-top:11px; border-top:1px solid #e2e8f0; font-weight:900; }
  .cart-entry-subtotal strong { color:#1d4ed8; font-size:18px; }
  .cart-items-preview { display:none; }
  .cart-items-detail { margin-top:4px; padding:6px 12px; border-radius:10px; color:#475569; font-size:12px; line-height:1.65; overflow-wrap:anywhere; }

  .cart-summary { margin-top:18px; padding:17px; border:1px solid #bfdbfe; border-radius:14px; background:#eff6ff; }
  .cart-summary-line { display:flex; justify-content:space-between; gap:12px; padding:5px 0; color:#334155; font-size:14px; }
  .cart-summary-line.grand-total { margin-top:9px; padding-top:13px; border-top:1px solid #bfdbfe; color:#0f172a; font-size:20px; font-weight:900; }
  .cart-summary-line.grand-total strong { color:#1d4ed8; font-variant-numeric:tabular-nums; }
  .cart-print-btn { width:100%; min-height:46px; margin-top:15px; border:0; border-radius:10px; background:#111827; color:#fff; font-size:15px; font-weight:900; cursor:pointer; }

  @media(max-width:480px) {

  }

  .cart-fab-count {
    position:absolute; top:-5px; right:-5px; min-width:23px; height:23px;
    display:flex; align-items:center; justify-content:center; padding:0 5px;
    border:2px solid #fff; border-radius:999px; background:#facc15;
    color:#111827; font-size:12px; font-weight:900; font-variant-numeric:tabular-nums;
  }
  .cart-fab-count:empty { display:none; }

  /* 장바구니는 별도 탭이 아닌 오버레이 패널에서 관리 */
  body.cart-modal-open { overflow:hidden; }
  .cart-modal-backdrop { position:fixed; inset:0; z-index:1400; background:rgba(15,23,42,.56); }
  .cart-modal {
    position:fixed; top:0; right:0; bottom:0; z-index:1401;
    display:flex; flex-direction:column;
    width:min(100%,590px); background:#f7f8fa;
    box-shadow:-16px 0 40px rgba(15,23,42,.25);
  }
  .cart-modal-header {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    flex:0 0 auto; padding:15px 19px;
    border-bottom:1px solid #e2e8f0; background:#fff;
  }
  .cart-modal-symbol { background:#111827; }
  .cart-close-btn { width:40px; height:40px; border:1px solid #e2e8f0; border-radius:50%; background:#f8fafc; font-size:27px; line-height:1; font-weight:400; cursor:pointer; }
  .cart-modal-body { flex:1; overflow-y:auto; overscroll-behavior:contain; padding:18px 16px 28px; }
  .cart-modal .cart-section { max-width:none; margin:0; }
  .cart-modal .cart-section h2 { position:static; }
  @media (max-width:480px) {
    .calculator-topbar { top:58px; padding:8px; gap:8px; border-radius:14px; }
    .subfield-tab { min-height:45px; font-size:14px; padding:6px 8px; }
    .cart-fab { width:53px; height:53px; flex-basis:53px; }

              <td>${row.item}</td>
              <td>${row.standard}</td>
              <td>${row.method}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `).join("") + '<div class="legal-table-help">모바일에서는 표를 좌우로 밀어 전체 내용을 확인할 수 있습니다.</div>';
}

function toggleLegalStandards(refId, button) {
  const content = document.getElementById(`standards-${refId}`);
  const ref = legalReferences.find(item => item.id === refId);
  if (!content || !ref) return;

  const isOpen = button.getAttribute("aria-expanded") === "true";
  if (isOpen) {
    button.setAttribute("aria-expanded", "false");
    content.classList.add("hidden");
    button.firstChild.textContent = "수질기준 및 검사방법 펼쳐보기";
    return;
  }

  if (!content.dataset.rendered) {
    content.innerHTML = createLegalStandardsHtml(ref);
    content.dataset.rendered = "true";
  }

  button.setAttribute("aria-expanded", "true");
  content.classList.remove("hidden");
  button.firstChild.textContent = "수질기준 및 검사방법 접기";
}

function toggleLegalCard(cardId) {
  const card = document.getElementById(`legal-card-${cardId}`);
  if (!card) return;

  const body = card.querySelector('.legal-card-body');
  const toggle = card.querySelector('.legal-card-toggle');
  if (!body || !toggle) return;

  const isOpen = card.classList.contains('open');
  card.classList.toggle('open', !isOpen);
  body.classList.toggle('hidden', isOpen);
  toggle.textContent = isOpen ? '◀' : '▼';
  toggle.setAttribute('aria-expanded', String(!isOpen));
  card.querySelector('.legal-card-header')?.setAttribute('aria-expanded', String(!isOpen));
}

function renderLegalReferences(query = "") {
  const area = document.getElementById("legalCardArea");
  const normalized = query.trim().toLowerCase();
  const orderMap = new Map(legalDisplayOrder.map((id, index) => [id, index]));
  const orderedReferences = [...legalReferences].sort((a, b) => {
    const aOrder = orderMap.has(a.id) ? orderMap.get(a.id) : Number.MAX_SAFE_INTEGER;
    const bOrder = orderMap.has(b.id) ? orderMap.get(b.id) : Number.MAX_SAFE_INTEGER;
    return aOrder - bOrder;
  });

  const filtered = orderedReferences.filter(ref => {
    const text = [
      ref.category, ref.title,
      ref.requestBasis.lawName, stripHtml(ref.requestBasis.content),
      ref.detailBasis.lawName, stripHtml(ref.detailBasis.content),
      ...ref.keywords,
      ...ref.attachments.map(item => item.name),
      ...(ref.waterStandards || []).flatMap(group => [
        group.name,
        ...group.rows.flatMap(row => [row.item, row.standard, row.method])
      ])
    ].join(" ").toLowerCase();
    return !normalized || text.includes(normalized);
  });

  document.getElementById("legalResultCount").textContent = filtered.length;
  area.innerHTML = "";

  if (filtered.length === 0) {
    area.innerHTML = '<div class="legal-empty">검색 결과가 없습니다.</div>';
    return;
  }

  filtered.forEach(ref => {
    const card = document.createElement("article");
    card.className = "legal-card";

      `<a class="legal-link primary" href="${item.url}" target="_blank" rel="noopener noreferrer">${item.name} 보기</a>`
    ).join("");
    const standardTypes = Array.isArray(ref.testStandard)
      ? ref.testStandard
      : ref.testStandard ? [ref.testStandard] : [];
    const standardBadge = standardTypes.map(type =>
      type === "drinking"

        : type === "water"

    ).join("");

    const standardsHtml = (ref.waterStandards || []).length
      ? `
        <section class="legal-block">
          <div class="legal-label">C. 수질기준 및 공정시험방법</div>
          <button type="button"
                  class="legal-standards-toggle"
                  aria-expanded="false"
                  aria-controls="standards-${ref.id}"
                  onclick="toggleLegalStandards('${ref.id}', this)">
            수질기준 및 검사방법 펼쳐보기
          </button>
          <div id="standards-${ref.id}" class="legal-standards-content hidden"></div>
        </section>
      `
      : '';

    card.id = `legal-card-${ref.id}`;
    card.innerHTML = `
      <div class="legal-card-header"
           role="button"
           tabindex="0"
           aria-expanded="false"
           aria-controls="legal-body-${ref.id}"
           onclick="toggleLegalCard('${ref.id}')"
           onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleLegalCard('${ref.id}');}">
        <div class="legal-card-heading">
          <div class="legal-category">${ref.category}</div>
          <div class="legal-title-row">
            <h3>${ref.title}</h3>
            ${standardBadge}
          </div>
        </div>
        <button type="button"
                class="legal-card-toggle"
                aria-label="카드 내용 열기"
                aria-expanded="false"
                tabindex="-1">◀</button>
      </div>
      <div id="legal-body-${ref.id}" class="legal-card-body hidden">
        <section class="legal-block">
          <div class="legal-label">${ref.requestBasis.label}</div>
          <div class="legal-law-name">${ref.requestBasis.lawName}</div>
          <div class="legal-text">${ref.requestBasis.content}</div>
          <div class="legal-links">
            <a class="legal-link" href="${ref.requestBasis.url}" target="_blank" rel="noopener noreferrer">법령 원문 보기</a>
          </div>
        </section>
        <section class="legal-block">
          <div class="legal-label">${ref.detailBasis.label}</div>
          <div class="legal-law-name">${ref.detailBasis.lawName}</div>
          <div class="legal-text">${ref.detailBasis.content}</div>
          <div class="legal-links">
            <a class="legal-link" href="${ref.detailBasis.url}" target="_blank" rel="noopener noreferrer">시행규칙 원문 보기</a>
            ${attachmentLinks}
          </div>
        </section>
        ${standardsHtml}
        <div class="legal-note">내용 확인일: ${ref.checkedDate} · 최신 개정 내용은 연결된 국가법령정보센터 원문에서 확인하세요.</div>

let currentField = "legal";
let lastCalculatorField = "drinking";
let cartOpen = false;

function changeField(field) {
  if (field === "calculator") field = lastCalculatorField;
  if (!["drinking", "pollution", "legal"].includes(field) || field === currentField) return;

  if (currentField === "drinking" || currentField === "pollution") {
    fieldStates[currentField].sampleCount = sampleCount;
  }
  closeCart();
  closeDetailView();
  document.getElementById("cartActionFeedback").classList.remove("show");
  currentField = field;

  const isLegal = field === "legal";
  const isCalculator = !isLegal;
  document.body.classList.toggle("calculator-active", isCalculator);
  if (isCalculator) lastCalculatorField = field;
  document.querySelectorAll(".field-tab").forEach(tab => {
    const active = tab.dataset.field === (isLegal ? "legal" : "calculator");
    tab.classList.toggle("active", active);
    tab.setAttribute("aria-selected", String(active));
  });
  document.querySelectorAll(".subfield-tab").forEach(tab => {
    const active = tab.dataset.field === lastCalculatorField;
    tab.classList.toggle("active", active);
    tab.setAttribute("aria-selected", String(active));
  });

  document.getElementById("calculatorContent").classList.toggle("hidden", !isCalculator);
  document.getElementById("legalContent").classList.toggle("hidden", !isLegal);
  document.getElementById("bottomResult").classList.toggle("hidden", !isCalculator);
  document.getElementById("detailBackdrop").classList.toggle("hidden", !isCalculator);

  if (isLegal) {
    renderLegalReferences(document.getElementById("legalSearch").value);
    window.scrollTo({ top: 0, behavior: "smooth" });
    return;
  }

  items = datasets[field].items;
  presets = datasets[field].presets;
  oneFeeGroups = datasets[field].oneFeeGroups;
  comboDiscountRules = datasets[field].comboDiscountRules;
  toggleSelectButtons = datasets[field].toggleSelectButtons;
  dependencyFreeRules = datasets[field].dependencyFreeRules;

  selectedItems = fieldStates[field].selectedItems;
  activePresets = fieldStates[field].activePresets;
  collapsedGroups = fieldStates[field].collapsedGroups;
  sampleCount = fieldStates[field].sampleCount;

  renderPresets();
  renderItems();
  renderSampleButtons();
  calculateTotal();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderPresets() {
  const presetArea = document.getElementById("presetArea");
  presetArea.innerHTML = "";

  presets.forEach(preset => {
    const btn = document.createElement("button");
    btn.className = "preset-btn span-1";

    /*
      묶음검사 버튼의 선택 상태는 실제 항목 선택 여부와 분리해서 관리한다.
      예: 지하수 먹는물 46항목이 상수도 59항목에 모두 포함되어도
      지하수 버튼과 상수도 버튼이 서로 자동으로 연동되어 보이지 않게 한다.
    */
    const isActivePreset = activePresets.has(preset.name);

    if (isActivePreset) {
      btn.classList.add("selected");
    }

    btn.innerHTML = `
      <span class="item-name">${isActivePreset ? "✓ " : ""}${preset.name}</span>
    `;

    btn.onclick = () => {
      if (isActivePreset) {
        preset.items.forEach(id => selectedItems.delete(id));
        activePresets.delete(preset.name);
      } else {
        preset.items.forEach(id => selectedItems.add(id));
        activePresets.add(preset.name);
      }

      renderPresets();
      renderItems();
      calculateTotal();
    };

    presetArea.appendChild(btn);
  });

  const clearBtn = document.createElement("button");
  clearBtn.className = "preset-btn span-1";
  clearBtn.textContent = "전체 해제";

  clearBtn.onclick = () => {
    selectedItems.clear();
    activePresets.clear();
    renderPresets();
    renderItems();
    calculateTotal();
  };

  presetArea.appendChild(clearBtn);
}


function isDependencyFree(item) {
  return dependencyFreeRules.some(rule => {
    const isTarget =
      rule.targetId === item.id ||
      (rule.targetAnyIds && rule.targetAnyIds.includes(item.id));

    if (!isTarget) return false;

    if (rule.requiredId && selectedItems.has(rule.requiredId)) {
      return true;
    }

    if (rule.requiredAnyIds && rule.requiredAnyIds.some(id => selectedItems.has(id))) {
      return true;
    }

    return false;
  });
}

function getOneFeeGroup(item) {
  return oneFeeGroups.find(group => group.itemIds.includes(item.id));
}

function isOneFeeGroupExempt(item) {
  const group = getOneFeeGroup(item);
  if (!group) return false;

  const selectedInGroup = group.itemIds.filter(id => selectedItems.has(id));

  if (selectedInGroup.length === 0) {
    return false;
  }

  // 그룹 내에서 선택된 첫 번째 항목만 수수료를 계산하고, 나머지는 면제 처리
  return selectedInGroup[0] !== item.id;
}

function shouldShowExempt(item) {
  return isDependencyFree(item) || isOneFeeGroupExempt(item);
}

function getComboDiscount(item) {
  // 동시의뢰 조건(모든 itemIds 선택)을 만족한 경우에만 지정한 항목에 할인액을 반영
  return comboDiscountRules.reduce((sum, rule) =>
    sum + (rule.discountTargetId === item.id && rule.itemIds.every(id => selectedItems.has(id)) ? rule.discount : 0), 0);
}

function getEffectiveFee(item) {
  if (shouldShowExempt(item)) return 0;
  return Math.max(0, item.fee - getComboDiscount(item));
}

function getFeeText(item) {
  if (shouldShowExempt(item) && item.fee > 0) {
    return `<span class="fee-exempt">면제</span>`;
  }
  const discount = getComboDiscount(item);
  if (discount > 0) {
    return `${getEffectiveFee(item).toLocaleString()}원 <small class="fee-combo-note">(동시의뢰 할인 -${discount.toLocaleString()}원)</small>`;
  }
  return `${item.fee.toLocaleString()}원`;
}

function renderToggleButton(toggle) {
  const btn = document.createElement("button");
  btn.className = `item-btn span-${toggle.span || 1}`;

  const selectedCount = toggle.itemIds.filter(id => selectedItems.has(id)).length;
  const allSelected = selectedCount === toggle.itemIds.length;
  const someSelected = selectedCount > 0 && !allSelected;

  if (allSelected) {
    btn.classList.add("selected");
  } else if (someSelected) {
    btn.classList.add("partial-selected");
  }

  btn.innerHTML = `
    <span class="item-name">${allSelected ? "✓ " : ""}${toggle.name}</span>
    <span class="item-fee">${selectedCount}/${toggle.itemIds.length} 선택</span>
  `;

  btn.onclick = () => {
    if (allSelected) {
      toggle.itemIds.forEach(id => selectedItems.delete(id));
    } else {
      toggle.itemIds.forEach(id => selectedItems.add(id));
    }

    activePresets.clear();
    renderPresets();
    renderItems();
    calculateTotal();
  };

  return btn;
}

function getGridColumnCount() {
  if (window.matchMedia("(max-width: 480px)").matches) return 2;
  if (window.matchMedia("(max-width: 768px)").matches) return 3;
  return 4;
}

function getSafeSpan(span) {
  return Math.min(span || 1, getGridColumnCount());
}

function createEmptyCell() {
  const empty = document.createElement("div");
  empty.className = "empty-cell";
  return empty;
}

function padRowToEnd(grid, rowFill) {
  const columns = getGridColumnCount();

  while (rowFill > 0 && rowFill < columns) {
    grid.appendChild(createEmptyCell());
    rowFill += 1;
  }

  return 0;
}

function appendButtonToGrid(grid, btn, span, rowFill) {
  const columns = getGridColumnCount();
  const safeSpan = Math.min(span || 1, columns);

  if (rowFill + safeSpan > columns) {
    rowFill = padRowToEnd(grid, rowFill);
  }

  grid.appendChild(btn);
  rowFill += safeSpan;

  if (rowFill >= columns) {
    rowFill = 0;
  }

  return rowFill;
}

function appendToggleAtRowEnd(grid, toggle, rowFill) {
  const columns = getGridColumnCount();
  const toggleSpan = getSafeSpan(toggle.span || 1);

  if (toggleSpan >= columns) {
    rowFill = padRowToEnd(grid, rowFill);
    grid.appendChild(renderToggleButton(toggle));
    return 0;
  }

  if (rowFill + toggleSpan > columns) {
    rowFill = padRowToEnd(grid, rowFill);
  }

  while (rowFill < columns - toggleSpan) {
    grid.appendChild(createEmptyCell());
    rowFill += 1;
  }

  grid.appendChild(renderToggleButton(toggle));
  rowFill += toggleSpan;

  if (rowFill >= columns) {
    rowFill = 0;
  }

  return rowFill;
}

function createItemButton(item) {
  const btn = document.createElement("button");
  btn.className = `item-btn span-${item.span || 1}`;

  if (selectedItems.has(item.id)) {
    btn.classList.add("selected");
  }

  btn.innerHTML = `
    <span class="item-name">${selectedItems.has(item.id) ? "✓ " : ""}${item.name}</span>
    <span class="item-fee">${getFeeText(item)}</span>
  `;

  btn.onclick = () => {
    if (selectedItems.has(item.id)) {
      selectedItems.delete(item.id);
    } else {
      selectedItems.add(item.id);
    }

    activePresets.clear();
    renderPresets();
    renderItems();
    calculateTotal();
  };

  return btn;
}

function getTogglesByFirstItemId(groupName) {
  const result = {};

  toggleSelectButtons
    .filter(toggle => toggle.group === groupName)
    .forEach(toggle => {
      const firstItemId = toggle.itemIds[0];

      if (!result[firstItemId]) {
        result[firstItemId] = [];
      }

      result[firstItemId].push(toggle);
    });

  return result;
}

function renderItems() {
  const itemArea = document.getElementById("itemArea");
  itemArea.innerHTML = "";

  const groups = {};

  items.forEach(item => {
    if (!groups[item.group]) {
      groups[item.group] = [];
    }
    groups[item.group].push(item);
  });

  Object.keys(groups).forEach(groupName => {
    if (collapsedGroups[groupName] === undefined) {
      collapsedGroups[groupName] = false;
    }

    const selectedInGroup = groups[groupName].filter(item => selectedItems.has(item.id)).length;
    const totalInGroup = groups[groupName].length;

    const groupHeaderRow = document.createElement("div");
    groupHeaderRow.className = "group-header-row";

    const groupHeader = document.createElement("button");
    groupHeader.className = "group-header";
    const selectedCountHtml = selectedInGroup > 0
      ? `<span class="group-count-selected">${selectedInGroup}</span>`
      : `${selectedInGroup}`;

    groupHeader.innerHTML =
      `${collapsedGroups[groupName] ? "▶" : "▼"} ${groupName} ` +
      `(${selectedCountHtml}/${totalInGroup})`;

    groupHeader.onclick = () => {
      collapsedGroups[groupName] = !collapsedGroups[groupName];
      renderItems();
    };

    const groupClearBtn = document.createElement("button");
    groupClearBtn.className = "group-clear-btn";
    groupClearBtn.textContent = selectedInGroup === 0 ? "전체선택" : "전체해제";
    groupClearBtn.onclick = () => {
      if (selectedInGroup === 0) {
        groups[groupName].forEach(item => selectedItems.add(item.id));
      } else {
        groups[groupName].forEach(item => selectedItems.delete(item.id));
      }
      activePresets.clear();
      renderPresets();
      renderItems();
      calculateTotal();
    };

    groupHeaderRow.appendChild(groupHeader);
    groupHeaderRow.appendChild(groupClearBtn);
    itemArea.appendChild(groupHeaderRow);

    if (!collapsedGroups[groupName]) {
      const grid = document.createElement("div");
      grid.className = "button-grid";

      let rowFill = 0;

      const groupToggles = toggleSelectButtons.filter(toggle => toggle.group === groupName);
      groupToggles.forEach(toggle => {
        rowFill = appendButtonToGrid(grid, renderToggleButton(toggle), toggle.span || 1, rowFill);
      });

      // 토글 버튼들은 그룹 맨 앞에 모아 배치하고, 다음 줄부터 개별 항목을 표시한다.
      if (groupToggles.length > 0) {
        rowFill = padRowToEnd(grid, rowFill);
      }

      groups[groupName].forEach(item => {
        rowFill = appendButtonToGrid(grid, createItemButton(item), item.span || 1, rowFill);

      });

      itemArea.appendChild(grid);
    }
  });
}

function changeSampleCount(delta) {
  const next = Math.max(1, Math.min(99, sampleCount + delta));
  if (next === sampleCount) return;
  sampleCount = next;
  fieldStates[currentField].sampleCount = sampleCount;
  renderSampleButtons();
  calculateTotal();
}

function renderSampleButtons() {
  const sampleArea = document.getElementById("sampleArea");
  sampleArea.innerHTML = "";

  const wrapper = document.createElement("div");
  wrapper.className = "sample-control";

  const minusBtn = document.createElement("button");
  minusBtn.className = "sample-step-btn";
  minusBtn.textContent = "−";
  minusBtn.onclick = () => changeSampleCount(-1);

  const numberInput = document.createElement("input");
  numberInput.className = "sample-number";
  numberInput.type = "number";
  numberInput.min = "1";
  numberInput.max = "99";
  numberInput.value = sampleCount;

  numberInput.oninput = () => {
    const value = Number(numberInput.value);
    if (!Number.isNaN(value) && value >= 1) {
      sampleCount = Math.min(99, Math.floor(value));
      fieldStates[currentField].sampleCount = sampleCount;
      calculateTotal();
    }
  };

  numberInput.onblur = () => {
    if (!numberInput.value || Number(numberInput.value) < 1) {
      sampleCount = 1;
    }
    fieldStates[currentField].sampleCount = sampleCount;
    numberInput.value = sampleCount;
    calculateTotal();
  };

  const plusBtn = document.createElement("button");
  plusBtn.className = "sample-step-btn";
  plusBtn.textContent = "+";
  plusBtn.onclick = () => changeSampleCount(1);

  wrapper.appendChild(minusBtn);
  wrapper.appendChild(numberInput);
  wrapper.appendChild(plusBtn);

  const help = document.createElement("div");
  help.className = "sample-help";
  help.textContent = "− / + 버튼 또는 숫자 직접 입력";

  sampleArea.appendChild(wrapper);
  sampleArea.appendChild(help);
}

function stripHtml(html) {
  const temp = document.createElement("div");
  temp.innerHTML = html;
  return temp.textContent || temp.innerText || "";
}

function updateSelectedDetailList(selected) {
  const list = document.getElementById("selectedDetailList");
  list.innerHTML = "";

  if (selected.length === 0) {
    const empty = document.createElement("div");
    empty.className = "selected-detail-empty";
    empty.textContent = "선택된 검사항목이 없습니다.";
    list.appendChild(empty);
    return;
  }

  // 작성된 검사항목 순서(items 배열 순서)대로 항목명만 콤마로 구분해 표시
  const names = selected.map(item => stripHtml(item.name));
  const text = document.createElement("div");
  text.className = "selected-detail-item";
  text.textContent = names.join(", ");
  list.appendChild(text);
}

function setDetailView(open) {
  detailOpen = open;

  const bottom = document.querySelector(".bottom-result");
  const backdrop = document.getElementById("detailBackdrop");

  bottom.classList.toggle("detail-open", detailOpen);
  backdrop.classList.toggle("show", detailOpen);
}

function toggleDetailView() {
  setDetailView(!detailOpen);
}

function toggleDetailViewFromSheet(event) {
  // 장바구니 추가 버튼 등 조작 요소를 누르면 바텀시트는 접거나 펼치지 않는다.
  if (event.target.closest("button, input, a")) return;
  toggleDetailView();
}

function closeDetailView() {
  setDetailView(false);
}

function calculateTotal() {
  const selected = items.filter(item => selectedItems.has(item.id));

  updateSelectedDetailList(selected);

  const subtotal = selected.reduce((sum, item) => sum + getEffectiveFee(item), 0);
  const actualItemCount = selected.reduce((sum, item) => sum + item.count, 0);
  const total = subtotal * sampleCount;

  document.getElementById("actualItemCount").textContent = actualItemCount;
  document.getElementById("sampleCountText").textContent = sampleCount;
  document.getElementById("subtotal").textContent = subtotal.toLocaleString();
  document.getElementById("total").textContent = total.toLocaleString();
  document.getElementById("addCartBtn").disabled = selected.length === 0;
}

/* ===== 장바구니: 저장은 현재 브라우저에만 (개인정보/민원인 성명 미저장) ===== */
const CART_STORAGE_KEY = "water-fee-calculator-cart-v1";
const CART_TITLE_STORAGE_KEY = "water-fee-calculator-cart-title-v1";
const CART_DEFAULT_TITLE = "검체 목록";
const CART_MAX_QTY = 9999;
let cart = [];
let cartTitle = CART_DEFAULT_TITLE;
let cartStorageAvailable = true;
let cartStorageMessage = "이 브라우저에 임시 저장합니다. 수납 완료 기록은 아닙니다.";

function normalizeCartQty(value) {
  const num = Number(value);
  if (!Number.isFinite(num)) return null;
  if (!Number.isInteger(num) || num < 1 || num > CART_MAX_QTY) return null;
  return num;
}

function isValidSavedCartEntry(entry) {
  if (!entry || typeof entry !== "object" || Array.isArray(entry)) return false;
  if (typeof entry.id !== "string" || !entry.id || entry.id.length > 100) return false;
  if (entry.field !== "drinking" && entry.field !== "pollution") return false;
  if (typeof entry.label !== "string" || entry.label.length > 200) return false;
  if (normalizeCartQty(entry.qty) === null) return false;
  if (!Number.isSafeInteger(entry.unitFee) || entry.unitFee < 0) return false;
  if (!Array.isArray(entry.itemDetails) || !entry.itemDetails.length || entry.itemDetails.length > 300) return false;
  if (!entry.itemDetails.every(item => item && typeof item.id === "string" && typeof item.name === "string" && item.name.length < 180 && Number.isSafeInteger(item.effectiveFee) && item.effectiveFee >= 0 && Number.isInteger(item.count) && item.count >= 1)) return false;
  return entry.itemDetails.reduce((sum, item) => sum + item.effectiveFee, 0) === entry.unitFee;
}

// 구버전 장바구니의 복합 대장균군 항목을 두 개의 실제 검사항목으로 변환한다.
// 복합 항목과 단독 항목을 동시에 담은 과거 사례는 뜻이 불명확하므로 자동으로 바꾸지 않는다.
function migrateLegacyColiformEntry(entry) {
  const index = entry.itemDetails.findIndex(item => item.id === "ecoliall");
  if (index < 0 || entry.field !== "drinking") return {entry, changed: false};
  const oldItem = entry.itemDetails[index];
  if (entry.itemDetails.some(item => item.id === "total_coliform1" || item.id === "ecoli2") ||
      oldItem.effectiveFee !== 12600 || oldItem.count !== 2) return {entry, changed: false};
  const revisedDetails = entry.itemDetails.slice();
  revisedDetails.splice(index, 1,
    {id:"total_coliform1", name:"총대장균군", count:1, effectiveFee:8800},
    {id:"ecoli2", name:"분원성대장균군", count:1, effectiveFee:3800});
  return {entry:{...entry, itemDetails:revisedDetails}, changed: true};
}

function loadCart() {
  try {
    const storedTitle = localStorage.getItem(CART_TITLE_STORAGE_KEY);
    if (typeof storedTitle === "string" && storedTitle.trim()) cartTitle = storedTitle.trim().slice(0,40);
    const stored = localStorage.getItem(CART_STORAGE_KEY);
    if (!stored) return;
    const parsed = JSON.parse(stored);
    if (!Array.isArray(parsed) || parsed.length > 1000 || !parsed.every(isValidSavedCartEntry) || new Set(parsed.map(x => x.id)).size !== parsed.length) {
      cartStorageMessage = "저장된 장바구니 형식에 문제가 있어 불러오지 않았습니다. 기존 저장 데이터는 보존됩니다.";
      cartStorageAvailable = false;
      return;
    }
    let migrated = false;
    cart = parsed.map(original => {
      const result = migrateLegacyColiformEntry(original);
      migrated ||= result.changed;
      return result.entry;
    });
    // 저장이 가능할 때만 변환된 내역을 남기며, 기존 검체 수·총 수수료는 유지한다.
    if (migrated) saveCart();
  } catch (error) {
    cartStorageAvailable = false;
    cartStorageMessage = "브라우저 저장 기능을 사용할 수 없습니다. 페이지를 닫기 전에 주의해 주세요.";
  }
}

function saveCart() {
  if (!cartStorageAvailable) return;
  try {
    localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
    localStorage.setItem(CART_TITLE_STORAGE_KEY, cartTitle);
    cartStorageMessage = "이 브라우저에 임시 저장 중 · 수납 기록이 아니며, 다른 PC와 공유되지 않습니다.";
  } catch (error) {
    cartStorageAvailable = false;
    cartStorageMessage = "저장에 실패했습니다. 페이지를 닫거나 새로고침하면 장바구니가 사라질 수 있습니다.";
  }
}

function getCartLabel(selected, field) {
  const currentIds = new Set(selected.map(item => item.id));
  const exactPreset = datasets[field].presets.find(preset =>
    preset.items.length === currentIds.size && preset.items.every(id => currentIds.has(id))
  );
  if (exactPreset) return stripHtml(exactPreset.name.replace(/<br\s*\/?>/gi, " ")).replace(/\s+/g, " ").trim();
  const exactToggle = datasets[field].toggleSelectButtons.find(toggle =>
    toggle.itemIds.length === currentIds.size && toggle.itemIds.every(id => currentIds.has(id))
  );
  if (exactToggle) return stripHtml(exactToggle.name.replace(/<br\s*\/?>/gi, " ")).replace(/\s+/g, " ").trim();

  // 임의 선택한 검사항목도 같은 방식으로 독립적인 의뢰로 취급한다.
  const totalItems = selected.reduce((sum, item) => sum + item.count, 0);
  return `개별 선택 ${totalItems}항목`;
}

function addCurrentToCart(event) {
  if (event) event.stopPropagation();
  if (currentField !== "drinking" && currentField !== "pollution") return;
  const selected = items.filter(item => selectedItems.has(item.id));
  if (!selected.length) return;
  const newEntry = {
    id: "req-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10),
    field: currentField,
    label: getCartLabel(selected, currentField),
    qty: sampleCount,
    itemDetails: selected.map(item => ({
      id: item.id,
      name: stripHtml(item.name.replace(/<br\s*\/?>/gi, " ")).replace(/\s+/g, " ").trim(),
      count: item.count,
      effectiveFee: getEffectiveFee(item)
    })),
    unitFee: selected.reduce((sum, item) => sum + getEffectiveFee(item), 0)
  };
  cart.push(newEntry);
  saveCart();
  updateCartIndicators();
  renderCart();

  // 다른 의뢰를 곧바로 받을 수 있도록 현재 계산기만 초기화한다.
  selectedItems.clear();
  activePresets.clear();
  sampleCount = 1;
  fieldStates[currentField].sampleCount = 1;
  closeDetailView();
  renderPresets();
  renderItems();
  renderSampleButtons();
  calculateTotal();
  document.getElementById("cartActionFeedback").textContent = "장바구니에 저장했습니다. 다음 검사 항목을 선택하세요.";
  document.getElementById("cartActionFeedback").classList.add("show");
  // 현재 계산기에서 항목을 추가하는 반복 흐름이므로 페이지 이동은 하지 않는다.
}

// 장바구니 건수는 검사 종류가 아닌 모든 의뢰의 검체 수량 합계로 표시한다.
function getCartTotalSampleCount() {
  return cart.reduce((sum, entry) => sum + entry.qty, 0);
}

function updateCartIndicators() {
  const totalSamples = getCartTotalSampleCount();
  document.getElementById("cartTabCount").textContent = totalSamples ? totalSamples.toLocaleString("ko-KR") : "";
  document.getElementById("openCartBtn").setAttribute("aria-label", `장바구니 열기 · 검체 총 ${totalSamples.toLocaleString("ko-KR")}건`);
  document.getElementById("cartHeadingCount").textContent = `${totalSamples.toLocaleString("ko-KR")}건`;
  const titleInput = document.getElementById("cartTitleInput");
  if (titleInput && titleInput.value !== cartTitle) titleInput.value = cartTitle;
}

function setCartQty(entryId, value) {
  const next = normalizeCartQty(value);
  if (next === null) return false;
  const entry = cart.find(e => e.id === entryId);
  if (!entry) return false;
  entry.qty = next;
  saveCart();
  renderCart();
  return true;
}

function removeCartEntry(entryId) {
  cart = cart.filter(e => e.id !== entryId);
  saveCart();
  renderCart();
}

function startNewRequest() {
  if (!cart.length) return;
  if (!window.confirm("현재 장바구니의 모든 검사 의뢰를 삭제할까요? 삭제한 내역은 복구할 수 없습니다.")) return;
  cart = [];
  // 새 민원에는 모든 분야의 미확정 선택도 남아 있지 않게 한다.
  for (const state of Object.values(fieldStates)) {
    state.selectedItems.clear();
    state.activePresets.clear();
    state.sampleCount = 1;
  }
  if (currentField === "drinking" || currentField === "pollution") sampleCount = 1;
  saveCart();
  renderCart();
}

function formatWon(value) { return `${value.toLocaleString("ko-KR")}원`; }

function renderCart() {
  const list = document.getElementById("cartList");
  list.replaceChildren();
  const empty = cart.length === 0;
  document.getElementById("cartEmpty").classList.toggle("hidden", !empty);
  document.getElementById("cartSummary").classList.toggle("hidden", empty);
  document.getElementById("clearCartBtn").disabled = empty;
  document.getElementById("cartPrintBtn").disabled = empty;
  const legacyEntries = cart.some(entry => entry.itemDetails.some(item => item.id === "ecoliall"));
  updateCartIndicators();

  cart.forEach((entry, index) => {
    const card = document.createElement("article");
    card.className = "cart-entry";
    const heading = document.createElement("div");
    heading.className = "cart-entry-top";
    const headText = document.createElement("div");
    const title = document.createElement("div");
    title.className = "cart-entry-title";
    title.textContent = `${index+1}. ${entry.label}`;
    headText.append(title);
    const remove = document.createElement("button");
    remove.type = "button";
    remove.className = "cart-remove-btn";
    remove.textContent = "삭제";
    remove.setAttribute("aria-label", `${index+1}번 검사 의뢰 삭제`);
    remove.onclick = () => removeCartEntry(entry.id);
    heading.append(headText, remove);
    card.append(heading);

    const feeRow = document.createElement("div");
    feeRow.className = "cart-entry-row";
    const feeLabel = document.createElement("span");
    feeLabel.textContent = "검체당 수수료";
    const feeValue = document.createElement("strong");
    feeValue.textContent = formatWon(entry.unitFee);
    feeRow.append(feeLabel, feeValue);
    card.append(feeRow);

    const qtyRow = document.createElement("div");
    qtyRow.className = "cart-entry-row";
    const qtyLabel = document.createElement("span");
    qtyLabel.textContent = "검체 수";
    const qtyControl = document.createElement("div");
    qtyControl.className = "cart-qty-control";
    const minus = document.createElement("button");
    minus.type = "button";
    minus.textContent = "−";
    minus.disabled = entry.qty <= 1;
    minus.setAttribute("aria-label", `${index+1}번 검체 수 감소`);
    minus.onclick = () => setCartQty(entry.id, entry.qty - 1);
    const quantity = document.createElement("input");
    quantity.type = "number";
    quantity.min = "1";
    quantity.max = String(CART_MAX_QTY);
    quantity.step = "1";
    quantity.value = entry.qty;
    quantity.setAttribute("aria-label", `${index+1}번 검사 의뢰 검체 수`);
    // 입력 중에는 재렌더하지 않고, 확정 후에만 유효한 정수를 적용한다.
    quantity.onchange = () => { if (!setCartQty(entry.id, quantity.value)) quantity.value = entry.qty; };
    quantity.onblur = () => { if (document.body.contains(quantity) && !setCartQty(entry.id, quantity.value)) quantity.value = entry.qty; };
    quantity.onkeydown = event => { if (event.key === "Enter") quantity.blur(); };
    const plus = document.createElement("button");
    plus.type = "button";
    plus.textContent = "+";
    plus.disabled = entry.qty >= CART_MAX_QTY;
    plus.setAttribute("aria-label", `${index+1}번 검체 수 증가`);
    plus.onclick = () => setCartQty(entry.id, entry.qty+1);
    qtyControl.append(minus, quantity, plus);
    qtyRow.append(qtyLabel, qtyControl);
    card.append(qtyRow);

    const subtotalRow = document.createElement("div");
    subtotalRow.className = "cart-entry-row cart-entry-subtotal";
    const subLabel = document.createElement("span");
    subLabel.textContent = "소계";
    const subValue = document.createElement("strong");
    subValue.textContent = formatWon(entry.unitFee * entry.qty);
    subtotalRow.append(subLabel, subValue);
    card.append(subtotalRow);

    const names = entry.itemDetails.map(item => item.name);
    const details = document.createElement("details");
    details.className = "cart-items-detail";
    const summary = document.createElement("summary");
    summary.textContent = `전체 ${names.length}개 검사항목 보기`;
    const content = document.createElement("p");
    content.textContent = names.join(", ");
    details.append(summary, content);
    card.append(details);
    list.append(card);
  });
  document.getElementById("cartOrderCount").textContent = `${cart.length.toLocaleString("ko-KR")}종`;
  document.getElementById("cartSampleCount").textContent = `${getCartTotalSampleCount().toLocaleString("ko-KR")}건`;
  document.getElementById("cartGrandTotal").textContent = formatWon(cart.reduce((sum, entry) => sum + entry.unitFee * entry.qty, 0));
  updatePrintArea();
}

function escapePrintText(value) {
  return String(value).replace(/[&<>"']/g, chr => ({"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"})[chr]);
}

function updatePrintArea() {
  const area = document.getElementById("printArea");
  if (!cart.length) { area.innerHTML = ""; return; }
  const now = new Date();
  const issuedAt = now.toLocaleString("ko-KR", {year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
  const entries = cart.map((entry, index) => `
    <div class="print-entry">
      <div class="print-title">${index + 1}. ${escapePrintText(entry.label)} (${entry.field === "drinking" ? "먹는물" : "수질"})</div>
      <div class="print-line"><span>검체당 수수료</span><strong>${formatWon(entry.unitFee)}</strong></div>
      <div class="print-line"><span>검체 수</span><strong>${entry.qty.toLocaleString()}개</strong></div>
      <div class="print-line print-subtotal"><span>소계</span><strong>${formatWon(entry.unitFee * entry.qty)}</strong></div>
      <div class="print-items"><strong>검사항목:</strong> ${escapePrintText(entry.itemDetails.map(item => item.name).join(", "))}</div>
    </div>`).join("");
  area.innerHTML = `<h1>${escapePrintText(cartTitle)}</h1>
    <div class="print-subheading">전북특별자치도 보건환경연구원 · 수질조사과</div>
    <div class="print-meta">출력일시: ${escapePrintText(issuedAt)} · 검사 의뢰 ${cart.length}건 · 검체 총 ${cart.reduce((n,e)=>n+e.qty,0)}개</div>
    ${entries}
    <div class="print-total"><span>전체 수수료</span><strong>${formatWon(cart.reduce((sum,e)=>sum+e.unitFee*e.qty,0))}</strong></div>
    <div class="print-note">※ 본 문서는 수수료 산정·납부 안내용이며, 수납 완료를 증명하는 영수증이 아닙니다.<br>※ 장바구니에 담을 때 계산된 단가가 적용되었습니다.</div>`;
}

function printCart() {
  if (!cart.length) return;
  updatePrintArea();
  window.print();
}

function normalizeCartTitle(value) {
  const text = String(value ?? "").trim().replace(/\s+/g, " ");
  return (text || CART_DEFAULT_TITLE).slice(0, 40);
}

function setCartTitle(value) {
  cartTitle = normalizeCartTitle(value);
  saveCart();
  updateCartIndicators();
  updatePrintArea();
}

loadCart();
renderCart();

renderPresets();
renderItems();
renderSampleButtons();
calculateTotal();
renderLegalReferences();

const cartTitleInputEl = document.getElementById("cartTitleInput");
cartTitleInputEl.value = cartTitle;
cartTitleInputEl.addEventListener("change", event => { setCartTitle(event.target.value); event.target.value = cartTitle; });
cartTitleInputEl.addEventListener("blur", event => { setCartTitle(event.target.value); event.target.value = cartTitle; });
cartTitleInputEl.addEventListener("keydown", event => { if (event.key === "Enter") event.target.blur(); });

document.getElementById("legalSearch").addEventListener("input", event => {
  renderLegalReferences(event.target.value);
});

window.addEventListener("resize", () => {
  renderItems();
});


// 모바일에서 바텀시트를 아래로 스와이프하면 닫힘
let sheetTouchStartY = 0;
const bottomSheet = document.getElementById("bottomResult");

bottomSheet.addEventListener("touchstart", function(event) {
  if (!detailOpen) return;
  sheetTouchStartY = event.touches[0].clientY;
}, { passive: true });

bottomSheet.addEventListener("touchend", function(event) {
  if (!detailOpen) return;
  const touchEndY = event.changedTouches[0].clientY;
  if (touchEndY - sheetTouchStartY > 70) {
    closeDetailView();
  }
}, { passive: true });



document.querySelectorAll(".field-tab, .subfield-tab").forEach(tab => {
  tab.addEventListener("click", () => changeField(tab.dataset.field));
});

// 장바구니 오버레이를 키보드로 닫기 / 포커스 유지
window.addEventListener("keydown", event => {
  if (!cartOpen) return;
  if (event.key === "Escape") { event.preventDefault(); closeCart(); return; }
  if (event.key !== "Tab") return;
  const dialog = document.getElementById("cartContent");
  const focusables = [...dialog.querySelectorAll('button:not([disabled]), input:not([disabled]), a[href], summary')].filter(el => el.getClientRects().length);
  if (!focusables.length) { event.preventDefault(); dialog.focus(); return; }
  const first = focusables[0], last = focusables[focusables.length - 1];
  if (event.shiftKey && (document.activeElement === first || document.activeElement === dialog)) { event.preventDefault(); last.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
});


// 모바일 Safari에서 더블탭 확대와 핀치 확대를 최대한 방지
let lastTouchEnd = 0;
document.addEventListener("touchend", function(event) {
  const now = Date.now();
  if (now - lastTouchEnd <= 300) {
    event.preventDefault();
  }
  lastTouchEnd = now;
}, { passive: false });

document.addEventListener("gesturestart", function(event) {
  event.preventDefault();
}, { passive: false });

</script>
